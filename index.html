<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Cue — voice-tracking teleprompter</title>
    <meta
      name="description"
      content="A teleprompter that listens to the narrator and follows along."
    />
    <meta name="theme-color" content="#0b0f14" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header id="bar">
      <button
        id="btn-menu"
        class="menu-toggle"
        aria-label="Open menu"
        aria-expanded="false"
        aria-controls="menu"
      >
        <span class="menu-toggle-bars" aria-hidden="true"><span></span><span></span></span>
        <span class="menu-toggle-label" aria-hidden="true">
          <span class="label-open">Menu</span>
          <span class="label-close">Close</span>
        </span>
      </button>
      <button
        id="btn-logo"
        class="brand"
        aria-label="Start listening"
        aria-pressed="false"
        title="Start"
      >
        <span class="brand-word">Cue</span>
      </button>
      <span id="rec-light" class="rec-light rec-light-corner" aria-hidden="true"></span>
    </header>

    <nav id="menu" aria-hidden="true" aria-label="Controls">
      <div class="menu-inner">
        <button id="btn-open" class="menu-item" title="Open a .md file">Open file</button>
        <label class="menu-item slider">
          <span>Text size</span>
          <input id="font-size" type="range" min="22" max="72" value="38" />
        </label>
        <label class="menu-item check"
          ><span>Mirror</span><input id="chk-mirror" type="checkbox"
        /></label>
        <label class="menu-item check"
          ><span>Keep awake</span><input id="chk-wake" type="checkbox"
        /></label>
        <button
          id="btn-start-menu"
          class="menu-item menu-item-start"
          aria-pressed="false"
          title="Start"
        >
          <span class="menu-item-start-label">Start</span>
        </button>
        <button id="btn-demo" class="menu-item" title="Load the demo script">Demo script</button>
      </div>
    </nav>
    <div id="menu-scrim"></div>

    <main id="stage">
      <div id="lens" aria-hidden="true"></div>
      <article id="script" class="md">
        <p class="placeholder">
          Open a markdown file or load the demo script, then press Start and read aloud.
        </p>
      </article>
    </main>

    <footer id="hud">
      <span id="status" class="pill">idle</span>
      <span id="transcript" title="Live transcript"></span>
    </footer>

    <div id="loader" hidden>
      <div class="loader-card">
        <div class="loader-bar"><div></div></div>
        <div id="loader-main">Preparing speech model…</div>
        <div id="loader-sub"></div>
        <div class="loader-hint">First run downloads ~40 MB — cached after that.</div>
      </div>
    </div>

    <input
      id="file-input"
      type="file"
      accept=".md,.markdown,.txt,text/markdown,text/plain"
      hidden
    />
    <script type="module" src="js/app.js"></script>
  </body>
</html>
