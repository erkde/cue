<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Cue — voice-tracking teleprompter</title>
    <meta
      name="description"
      content="A teleprompter that listens to the narrator and follows along."
    />
    <meta name="theme-color" content="#0b0f14" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header id="bar">
      <button
        id="btn-menu"
        class="menu-toggle"
        aria-label="Open menu"
        aria-expanded="false"
        aria-controls="menu"
      >
        <span class="menu-toggle-bars" aria-hidden="true"><span></span><span></span></span>
        <span class="menu-toggle-label" aria-hidden="true">
          <span class="label-open">Menu</span>
          <span class="label-close">Close</span>
        </span>
      </button>
      <button
        id="btn-logo"
        class="brand"
        aria-label="Start listening"
        aria-pressed="false"
        title="Start"
      >
        <span class="brand-word">Cue</span>
      </button>
    </header>
    <button
      id="btn-rec-light"
      class="rec-light-btn"
      aria-label="Start listening"
      aria-pressed="false"
      title="Start"
    >
      <span class="rec-light" aria-hidden="true"></span>
    </button>

    <nav id="menu" aria-hidden="true" aria-label="Controls">
      <div class="menu-inner">
        <div class="menu-group" role="group" aria-label="Script controls">
          <button id="btn-open" class="menu-item" title="Open a Markdown or text file">
            Open script
          </button>
          <button
            id="btn-start-menu"
            class="menu-item menu-item-start"
            aria-pressed="false"
            title="Start"
          >
            <span class="menu-item-start-label">Start</span>
          </button>
          <button id="btn-restart" class="menu-item" title="Return to the beginning">
            Start over
          </button>
          <button id="btn-demo" class="menu-item" title="Load the demo script">Demo script</button>
        </div>

        <div class="menu-group" role="group" aria-label="Settings">
          <label class="menu-item slider setting-font-size">
            <span>Text size</span>
            <input id="font-size" type="range" min="22" max="72" value="38" />
          </label>
          <label class="menu-item check setting-mirror"
            ><span>Mirror</span><input id="chk-mirror" type="checkbox"
          /></label>
          <label class="menu-item check setting-wake"
            ><span>Keep awake</span><input id="chk-wake" type="checkbox"
          /></label>
        </div>
        <div class="menu-group menu-group-update" role="group" aria-label="Application">
          <button
            id="btn-update"
            class="menu-item menu-item-update"
            title="Restart Cue to install the waiting update"
            hidden
          >
            Update available
          </button>
        </div>
      </div>
    </nav>
    <div id="menu-scrim"></div>

    <main id="stage">
      <div id="lens" aria-hidden="true"></div>
      <article id="script" class="md">
        <p class="placeholder">
          Open a markdown file or load the demo script, then press Start and read aloud.
        </p>
      </article>
    </main>

    <footer id="hud">
      <span id="status" class="pill">idle</span>
      <span id="transcript" title="Live transcript"></span>
    </footer>

    <div
      id="cue-dialog"
      hidden
      role="dialog"
      aria-modal="true"
      aria-labelledby="cue-dialog-title"
      aria-describedby="cue-message"
    >
      <div class="loader-card cue-dialog-card">
        <div class="dialog-mark cue-dialog-mark" aria-hidden="true"></div>
        <div id="cue-dialog-title" class="dialog-title">Cue stopped</div>
        <p id="cue-message" class="dialog-message"></p>
        <div class="dialog-actions">
          <button id="btn-cue-continue" class="dialog-button dialog-button-primary" type="button">
            Continue
          </button>
          <button id="btn-cue-cancel" class="dialog-button" type="button">Cancel</button>
        </div>
      </div>
    </div>

    <div id="loader" hidden>
      <div class="loader-card">
        <div class="loader-bar"><div></div></div>
        <div id="loader-main">Preparing speech model…</div>
        <div id="loader-sub"></div>
        <div id="loader-hint" class="loader-hint" hidden>
          One-time download — cached for next time.
        </div>
      </div>
    </div>

    <div
      id="update-fallback"
      hidden
      role="alertdialog"
      aria-modal="true"
      aria-labelledby="update-fallback-title"
      aria-describedby="update-fallback-message"
      tabindex="-1"
    >
      <div class="loader-card update-fallback-card">
        <div class="dialog-mark" aria-hidden="true"></div>
        <div id="update-fallback-title" class="dialog-title">Reopen Cue</div>
        <p id="update-fallback-message" class="dialog-message">
          Close and reopen Cue to finish updating.
        </p>
      </div>
    </div>

    <input
      id="file-input"
      type="file"
      accept=".md,.markdown,.txt,text/markdown,text/plain"
      hidden
    />
    <script type="module" src="js/app.js"></script>
  </body>
</html>
